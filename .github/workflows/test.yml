name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[derive]'
      - run: python -m unittest discover -s tests -v
      - run: nps-pi0-correct --package packages/x60_4_lh2_v5_smooth_lowe --input examples/clusters.tsv --output /tmp/corrected.tsv
